# Every push and pull request: the five checks against real PostgreSQL and Redis, a production
# dependency audit, then the Docker image and the whole stack started from it.
# Needs no secrets: the tests use dummy Stripe values and never call Stripe.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A new push to the same branch cancels the run still going for the previous one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The same images as docker-compose.yml. Dependabot updates that file, not these: copy its
    # digests here when it does.
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: payments
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: payments
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payments -d payments"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    # What .env holds locally. The e2e config replaces the Stripe values and the dashboard password
    # with its own; the test database and Redis database 1 are what the tests write to.
    env:
      DATABASE_URL: postgresql://payments:ci-password@localhost:5432/payments
      TEST_DATABASE_URL: postgresql://payments:ci-password@localhost:5432/payments_test
      REDIS_URL: redis://localhost:6379
      TEST_REDIS_URL: redis://localhost:6379/1
      APP_URL: http://localhost:3000
      STRIPE_SECRET_KEY: sk_test_ci_dummy_key
      STRIPE_WEBHOOK_SECRET: whsec_ci_dummy_secret
      ADMIN_PASSWORD: ci-dashboard-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The Node version in the Dockerfile; its bundled npm 11 accepts the lockfile.
          node-version: 24.22.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      # The same dependency set the runtime image installs (see Dockerfile): dev tools and the
      # optional Prisma CLI don't ship, so their findings don't fail the build.
      - run: npm audit --omit=dev --omit=optional --audit-level=high

  docker:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Write a .env with dummy values
        run: |
          cp .env.example .env
          sed -i 's/^ADMIN_PASSWORD=.*/ADMIN_PASSWORD=ci-dashboard-password/' .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-postgres-password/' .env
          sed -i 's/^REDIS_PASSWORD=.*/REDIS_PASSWORD=ci-redis-password/' .env
      - name: Build the image and start the whole stack
        run: docker compose --profile app up --build -d
      - name: Wait for the API to be healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/health; then echo; exit 0; fi
            sleep 2
          done
          echo "API never became healthy" >&2
          exit 1
      - name: Check the pages and the dashboard login
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/admin/queues)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -u admin:ci-dashboard-password http://127.0.0.1:3000/admin/queues)" = 200
          docker compose --profile app ps
      # Fails on HIGH or CRITICAL vulnerabilities that have a fix; unfixed ones can't be acted on.
      # Only the runtime image ships; the migrate image's Prisma CLI findings are known (L-6).
      - name: Scan the runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: stripe-payment-sync:local
          version: v0.70.0
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Show logs on failure
        if: failure()
        run: docker compose --profile app logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose --profile app down -v
